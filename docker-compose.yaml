version: '3.8'

services:
  frontend:
    build:
      context: "./SynCodex Frontend"
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: "./SynCodex Backend"
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - "./SynCodex Backend/.env"
    restart: always

  signaling-server:
    build:
      context: "./video-call-server"
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: always

  api:
    build:
      context: "./code runner"
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: always
